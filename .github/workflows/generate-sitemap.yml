name: Regenerate sitemap and static content

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes — keeps stats.html / reports.html / sitemap.xml fresh
    # even when no code is pushed, since backend report data changes
    # independently of commits to this repo.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-sitemap
  cancel-in-progress: false

jobs:
  generate:
    # Guard against re-triggering on the bot's own push using the commit
    # author, not a commit-message marker like "[skip ci]" — Cloudflare
    # Pages treats that bracket tag (case-insensitively, anywhere in the
    # message) as an instruction to skip deploying the commit entirely,
    # which silently broke every scheduled deploy.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap and static content
        run: node scripts/build-static.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sitemap.xml stats.html reports.html; then
            echo "No content changes, skipping commit."
            exit 0
          fi
          git add sitemap.xml stats.html reports.html
          git commit -m "chore: regenerate sitemap and static content"
          git push origin HEAD:main
