# Lint gate for prospectai-web pull requests (D-18).
#
# - The single job id `lint` is the branch-protection required-check context
#   (plan 01-08 configures it). Do not rename it or add a path filter, since a
#   skipped workflow leaves a required check pending.
# - The web test runner now exists (node:test, run by the "Unit tests" step). It checks the
#   committed SSE fixture copy against the contract tables pinned in
#   ui/sseEvents.js. The byte comparison with the backend's fixture runs in
#   backend CI, which clones this public repo read-only, and in the ProspectAI
#   deploy.sh preflight, because the backend repo is private and this job
#   holds no token.
# - The metrics render check stays a plain Node assert script.
# - generate-sitemap.yml is unrelated and untouched. It pushes to main every
#   15 minutes, which is why this workflow has no push trigger.
name: Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Metrics render check
        run: node scripts/check-metrics-render.mjs

      - name: Unit tests
        run: npm test
